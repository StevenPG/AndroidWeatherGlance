version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin-toolchain:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*", "org.jetbrains.kotlinx*"]
      network:
        patterns: ["com.squareup.*"]
      testing:
        patterns: ["junit*", "org.robolectric*", "androidx.test*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
